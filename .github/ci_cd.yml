name: Operaplus CI/CD (GHCR & Docker)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # =====================================================
  # 1. TESTS DJANGO
  # =====================================================
  test-django:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DB_NAME: opera_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: cle-de-test-uniquement-pas-un-secret
      DJANGO_SECRET_KEY: cle-de-test-uniquement-pas-un-secret

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opera_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opera_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Bibliothèques système requises par pycairo (via xhtml2pdf/svglib)
      # et par pdf2image (poppler)
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev pkg-config python3-dev poppler-utils

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Vérifie TOUTES les apps (et pas seulement cartographie)
      - name: Vérifier les migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests Django
        run: |
          python manage.py test

  # =====================================================
  # 2. BUILD ET PUBLICATION GHCR
  # =====================================================
  build-and-push:
    needs: test-django
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.nom.outputs.image }}

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Générer le nom de l'image
        id: nom
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:latest
            ${{ steps.nom.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================
  # 3. DEPLOIEMENT VPS
  # =====================================================
  deploy:
    needs: build-and-push

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m

          envs: GHCR_USER,GHCR_READ_TOKEN,IMAGE_TAG

          script: |
            set -Eeuo pipefail

            echo "======================================"
            echo "DEBUT DU DEPLOIEMENT MEAL AFRIQUE"
            echo "======================================"

            cd /home/PlateformeOperaPlus

            # IMAGE_TAG est lu par docker-compose.yml
            export IMAGE_TAG
            echo "Image à déployer : tag ${IMAGE_TAG}"

            # 1. Mise à jour du dépôt (docker-compose.yml, .env.example, etc.)
            echo "1. Mise à jour Git..."
            git pull origin main
            echo "Commit déployé : $(git rev-parse --short HEAD)"

            # 2. Vérification des identifiants
            echo "2. Vérification des identifiants GHCR..."

            if [ -z "${GHCR_USER:-}" ]; then
              echo "ERREUR : GHCR_USER est vide"
              exit 1
            fi

            if [ -z "${GHCR_READ_TOKEN:-}" ]; then
              echo "ERREUR : GHCR_READ_TOKEN est vide"
              exit 1
            fi

            echo "Identifiants GHCR disponibles."

            # 3. Authentification GHCR
            echo "3. Connexion à GHCR..."
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

            # 4. Récupération des images (web, celery, db, redis)
            echo "4. Téléchargement des images..."
            docker compose pull --quiet

            # 5. Migrations + fichiers statiques AVANT redémarrage
            #    (un seul conteneur temporaire : évite le pic mémoire au démarrage)
            echo "5. Migrations et fichiers statiques..."
            docker compose run --rm web sh -c \
              "python manage.py migrate --noinput && python manage.py collectstatic --noinput"

            # 6. Redémarrage : web et celery recréés sur la nouvelle image
            echo "6. Démarrage des conteneurs..."
            docker compose up -d

            # 7. Nettoyage des anciennes images (évite de saturer le disque du VPS)
            echo "7. Nettoyage des anciennes images..."
            docker image prune -f

            echo "======================================"
            echo "DEPLOIEMENT TERMINE"
            echo "======================================"