<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Terminée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 overflow-hidden">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-5%] w-[500px] h-[500px] rounded-full bg-indigo-100/50 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-blue-100/50 blur-[100px]"></div>
    </div>

    <main class="relative z-10 w-full max-w-lg">
        <div class="glass-card rounded-[3.5rem] p-10 md:p-14 shadow-[0_32px_64px_-16px_rgba(0,0,0,0.08)] text-center transition-all">
            
            <div class="mb-10 animate-float">
                <div class="inline-flex items-center justify-center w-24 h-24 rounded-[2.5rem] bg-white shadow-xl shadow-indigo-100 border border-indigo-50 rotate-3">
                    <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>

            <h1 class="text-3xl font-extrabold text-slate-900 mb-4 tracking-tight">
                Navigation terminée
            </h1>
            <p class="text-slate-500 text-lg mb-10 leading-relaxed">
                Vous avez atteint le dernier niveau de la hiérarchie pour l'entité 
                <span class="font-bold text-indigo-600 px-2 py-1 bg-indigo-50 rounded-lg">#{{ gest_id }}</span>. 
                Il n'y a plus de sous-sections disponibles dans cette branche.
            </p>

            <div class="flex gap-2 justify-center mb-10">
                <div class="h-1.5 w-12 bg-indigo-600 rounded-full"></div>
                <div class="h-1.5 w-12 bg-indigo-600 rounded-full"></div>
                <div class="h-1.5 w-12 bg-indigo-600 rounded-full"></div>
            </div>

            <div class="flex flex-col gap-4">
                <button onclick="window.history.back()" 
                        class="group flex items-center justify-center w-full py-4 bg-slate-900 text-white rounded-2xl font-semibold hover:bg-black transition-all shadow-lg active:scale-[0.98]">
                    <svg class="w-5 h-5 mr-2 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Revenir au niveau précédent
                </button>
                
                <a href="/" 
                   class="w-full py-4 bg-white text-slate-600 rounded-2xl font-semibold border border-slate-200 hover:bg-slate-50 hover:text-slate-900 transition-all text-center">
                    Tableau de bord principal
                </a>
            </div>

            <footer class="mt-14">
                <div class="inline-flex items-center px-4 py-2 bg-slate-50 rounded-full border border-slate-100">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse mr-2"></span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        {{ actual_institution.nom|default:"Système de Gestion Centralisé" }}
                    </span>
                </div>
            </footer>
        </div>
    </main>

</body>
</html>
