{% extends '../presentation.html' %}
{% load static %}

{% block content %}
<div class="min-h-[90vh] flex items-center justify-center px-4 py-12 bg-gradient-to-br from-slate-50 via-white to-red-50/30">
    <div class="w-full max-w-md relative group">
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-blue-100 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob"></div>
        
        <div class="relative bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] p-8 md:p-12 border border-white animate-in fade-in zoom-in duration-700">
            
            <div class="flex justify-center mb-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-emerald-500/20 rounded-3xl rotate-12 scale-110 blur-sm"></div>
                    <div class="relative w-20 h-20 bg-gradient-to-tr from-emerald-600 to-emerald-500 rounded-3xl flex items-center justify-center text-white shadow-xl ring-4 ring-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Nouveau mot de passe</h1>
                <p class="text-slate-500 text-sm">Créez un mot de passe sécurisé que vous n'utilisez pas ailleurs.</p>
            </div>

            <form method="post" action="/set_new_password/" class="space-y-5">
                {% csrf_token %}
                
                <div class="space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Nouveau mot de passe</label>
                    <div class="relative group/input">
                        <input type="password" name="password" id="password" required
                            class="w-full pl-5 pr-12 py-4 bg-slate-50/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all duration-300 outline-none text-slate-700"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-300 hover:text-emerald-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirmer le mot de passe</label>
                    <div class="relative group/input">
                        <input type="password" name="confirm_password" id="confirm_password" required
                            class="w-full pl-5 pr-12 py-4 bg-slate-50/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all duration-300 outline-none text-slate-700"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex gap-1 px-1">
                    <div class="h-1 w-full bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-1/3"></div></div>
                    <div class="h-1 w-full bg-slate-100 rounded-full"></div>
                    <div class="h-1 w-full bg-slate-100 rounded-full"></div>
                </div>

                <button type="submit" 
                    class="w-full bg-slate-900 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-slate-200 hover:shadow-emerald-200 transform hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-3 mt-4">
                    Mettre à jour le mot de passe
                </button>
            </form>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const messages = [
        {% for message in messages %}
        {
            text: "{{ message|escapejs }}",
            type: "{{ message.tags|default:'info' }}"
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    messages.forEach((msg) => {
        Swal.fire({
            toast: true,
            position: "top-end",
            icon: msg.type === 'success' || msg.type === 'error' || msg.type === 'warning' ? msg.type : 'info',
            title: msg.text,
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            background: "#1f2937",
            color: "#fff",
            showClass: { popup: 'animate__animated animate__fadeInRight' },
            hideClass: { popup: 'animate__animated animate__fadeOutRight' }
        });
    });
});
</script>
<script>
    function togglePassword(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }
</script>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
</style>
{% endblock %}
