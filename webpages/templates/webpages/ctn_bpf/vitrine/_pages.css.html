{# Styles communs aux pages intérieures (inclus par chaque page) #}
<style>
    .pg { background: #fff; color: var(--ink); }
    .pg-hero { background: var(--ink); color: #fff; padding: 140px 0 70px; position: relative; }
    .pg-crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.6); margin-bottom: 26px; list-style: none; padding: 0; }
    .pg-crumb a { color: rgba(255,255,255,.8); } .pg-crumb a:hover { color: #fff; }
    .pg-crumb li + li::before { content: "/"; margin-right: 8px; color: rgba(255,255,255,.35); }
    .pg-hero-grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 50px; align-items: center; }
    .pg-hero h1 { font-size: clamp(32px, 4.4vw, 54px); line-height: 1.06; letter-spacing: -.035em; font-weight: 800; margin: 14px 0 0; }
    .pg-hero p.lead { color: rgba(255,255,255,.75); font-size: 18px; line-height: 1.65; margin: 18px 0 0; max-width: 620px; }
    .pg-hero .op-btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.28); }
    .pg-badge { justify-self: center; width: 210px; height: 210px; border-radius: 48px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
        display: flex; align-items: center; justify-content: center; font-size: 74px; color: var(--acc); animation: pgFloat 5s ease-in-out infinite; }

    .pg-points { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

</style>
