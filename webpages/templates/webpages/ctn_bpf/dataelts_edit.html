{% extends './evaluer.html' %}

{% block content %}
<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 transition-colors duration-500 bg-gray-50 dark:bg-gray-950">
    <div class="max-w-4xl mx-auto">
        
        <div class="bg-white dark:bg-gray-900 shadow-2xl rounded-2xl overflow-hidden border border-gray-100 dark:border-gray-800 transition-all">
            
            <div class="p-8 border-b border-gray-100 dark:border-gray-800 bg-gradient-to-r from-white to-gray-50 dark:from-gray-900 dark:to-gray-800">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-blue-500/10 rounded-lg">
                        <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </div>
                    <div>
                        <h5 class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider">Configuration</h5>
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Mise à jour : {{ dataelts.m_name }}</h2>
                    </div>
                </div>
            </div>

            <form id="survey-form" method="POST" action="/edit_data/{{ dataelts.id }}/" class="p-8 space-y-8">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label for="name" class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Nom De L'élément</label>
                        <input type="text" name="nom_donne" id="name" 
                            class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 outline-none" 
                            required value="{{ dataelts.m_name }}">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 flex justify-between">
                            Type de Données 
                            <span class="text-[10px] px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800">
                                ACTUEL: {{ dataelts.m_value_type }}
                            </span>
                        </label>
                        <select name="data_eltype" id="data_eltype" 
                            class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition duration-200 cursor-pointer">
                            <option value="Number" {% if dataelts.m_value_type == 'Number' %}selected{% endif %}>Numérique</option>
                            <option value="Texte" {% if dataelts.m_value_type == 'Texte' %}selected{% endif %}>Texte</option>
                            <option value="Date" {% if dataelts.m_value_type == 'Date' %}selected{% endif %}>Date</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Nature Des Données</label>
                        <select name="nature_donne" id="nature_donne"
                            class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none cursor-not-allowed opacity-80">
                            <option value="Aggregate" {% if dataelts.m_domain_type == 'Aggregate' %}selected{% endif %}>Agrégat</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Mode d'Agrégation</label>
                        <select id="aggregation" name="aggregation" 
                            class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition duration-200">
                            <option value="s" {% if dataelts.m_aggregation_type == 's' %}selected{% endif %}>Somme</option>
                            <option value="a" {% if dataelts.m_aggregation_type == 'a' %}selected{% endif %}>Moyenne</option>
                            <option value="M" {% if dataelts.m_aggregation_type == 'M' %}selected{% endif %}>Maximum</option>
                            <option value="m" {% if dataelts.m_aggregation_type == 'm' %}selected{% endif %}>Minimum</option>
                          
                        </select>
                    </div>
                </div>
                {%if dataelts.define%}
                {%else%}
                 <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-gray-800 transition-colors duration-200">
                        <div class="flex items-center h-5">
                            <input id="is_calcul" 
                                   name="is_calcul" 
                                   type="checkbox"
                                   class="w-5 h-5 text-blue-600 bg-white border-gray-300 rounded cursor-pointer dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:ring-2 transition-all"
                                   {% if dataelts.is_calcul %} checked {% endif %}>
                        </div>
                        <label for="is_calcul" class="text-sm font-medium text-gray-700 dark:text-gray-300 cursor-pointer select-none">
                            Appliquer l'agrégation lors de l'importation
                        </label>
                    </div>
                    {%endif%}
                <div class="space-y-4">
                    <label class="group relative flex items-start gap-4 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50 hover:bg-white dark:hover:bg-gray-800 transition-all duration-300 cursor-pointer shadow-sm hover:shadow-md">
                        <div class="flex items-center h-5">
                            <input id="cumulatif" name="null_conserv" type="checkbox"
                                class="w-5 h-5 text-blue-600 border-gray-300 dark:border-gray-600 rounded focus:ring-blue-500 bg-white dark:bg-gray-700" {%if dataelts.define%} checked {%endif%}>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-gray-900 dark:text-white">Activer le calcul cumulatif</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Calcul basé sur les périodes historiques (Moyenne, Somme, etc.)</span>
                        </div>
                    </label>

                    <div id="periode_cummul" class="hidden overflow-hidden p-6 rounded-2xl border border-blue-100 dark:border-blue-900/30 bg-blue-50/30 dark:bg-blue-900/10 space-y-6 transition-all duration-500">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="flex h-2 w-2 rounded-full bg-blue-500"></span>
                            <h3 class="text-sm font-bold text-blue-700 dark:text-blue-400 uppercase tracking-tight">Paramètres de la période</h3>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-xs font-semibold text-gray-600 dark:text-gray-400">PÉRIODE DÉBUT</label>
                                <select name="periode_debut" class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm dark:text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">-- Sélectionner --</option>
                                    {% for p in periode %}
                                    {%if p.id == dataelts.periode_debut_id %}
                                    <option value="{{p.id}}" selected>{{p.nom}}</option>
                                    {%else%}
                                      <option value="{{p.id}}" >{{p.nom}}</option>
                                    {%endif%}
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-semibold text-gray-600 dark:text-gray-400">PÉRIODE FIN</label>
                                <select name="periode_fin" class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm dark:text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">-- Sélectionner --</option>
                                     {% for p in periode %}
                                    {%if p.id == dataelts.periode_fin_id %}
                                    <option value="{{p.id}}" selected>{{p.nom}}</option>
                                    {%else%}
                                      <option value="{{p.id}}" >{{p.nom}}</option>
                                    {%endif%}
                                    {% endfor %}
                                    <!-- {% for p in periode %}<option value="{{p.id}}">{{p.nom}}</option>{% endfor %} -->
                                </select>
                            </div>
                             <div class="space-y-2">
                                <label class="text-xs font-semibold text-gray-600 dark:text-gray-400">DataElement D'association</label>
                                <select name="association" class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm dark:text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">-- Sélectionner --</option>
                                    {%for elements in data_elts%}
                                        {%if elements.id == dataelts.parent_id%}
                                            <option selected value="{{elements.id}}">{{elements.m_name}}</option>
                                            {%else%}
                                             <option  value="{{elements.id}}">{{elements.m_name}}</option>
                                        {%endif%}
                                    {%endfor%}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="nicename" class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Alias (Nicename)</label>
                    <input type="text" id="nicename" name="nicename" value="{{ dataelts.nicename }}"
                        class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition duration-200">
                </div>

                <div class="pt-8 border-t border-gray-100 dark:border-gray-800 flex flex-col sm:flex-row gap-4 justify-end">
                    <button type="button" onclick="history.back()" class="px-6 py-3 text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition-colors">
                        Annuler
                    </button>
                    <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transform transition hover:-translate-y-0.5 active:scale-95">
                        Enregistrer les modifications
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const checkbox = document.getElementById('cumulatif');
    const bloc = document.getElementById('periode_cummul');

    function toggle() {
        if (checkbox.checked) {
            bloc.classList.remove('hidden');
            bloc.classList.add('animate-in', 'fade-in', 'slide-in-from-top-4');
        } else {
            bloc.classList.add('hidden');
        }
    }

    checkbox.addEventListener('change', toggle);
    toggle(); // Initial state
});
</script>
{% endblock %}
