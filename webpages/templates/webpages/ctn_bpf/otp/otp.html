{% extends '../presentation.html' %}
{% load static %}

{% block content %}
<br/><br/>
<div class="min-h-[90vh] flex items-center justify-center px-4 py-12 bg-gradient-to-br from-slate-50 via-white to-red-50/30">
    <div class="w-full max-w-md relative group">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-red-200 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob"></div>
        
        <div class="relative bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] p-8 md:p-12 border border-white animate-in fade-in zoom-in duration-700">
            
            <div class="flex justify-center mb-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-red-500/20 rounded-3xl -rotate-6 scale-110 blur-sm"></div>
                    <div class="relative w-20 h-20 bg-gradient-to-tr from-slate-900 to-slate-800 rounded-3xl flex items-center justify-center text-white shadow-xl ring-4 ring-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m14.562 0c.03.346.038.694.038 1.05 0 5.232-2.31 9.774-5.938 12.791a11.952 11.952 0 01-11.876 0C3.31 16.774 1 12.232 1 7c0-.356.008-.704.038-1.05M12 18.055v-2.11" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight">Vérification</h1>
                <p class="text-slate-500 leading-relaxed text-sm">
                    Nous avons envoyé un code à 6 chiffres à <br>
                    <span class="font-bold text-slate-700">{{ request.session.reset_email }}</span>
                </p>
            </div>

            <form method="post" action="/verify_otp/" class="space-y-8">
                {% csrf_token %}
                
                <div class="flex justify-between gap-2 md:gap-4" id="otp-inputs">
                    {% for i in "123456" %}
                    <input type="text" maxlength="1" 
                        class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-black bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-red-500 focus:ring-4 focus:ring-red-500/10 focus:bg-white transition-all outline-none text-slate-800"
                        pattern="[0-9]*" inputmode="numeric">
                    {% endfor %}
                </div>
                
                <input type="hidden" name="otp" id="full-otp">

                <div class="text-center">
                    <p class="text-sm text-slate-400 mb-1">Le code expire dans :</p>
                    <div id="timer" class="text-lg font-mono font-bold text-red-600 bg-red-50 inline-block px-4 py-1 rounded-full border border-red-100">
                        05:00
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-slate-900 hover:bg-red-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-slate-200 hover:shadow-red-200 transform hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-3">
                    Vérifier le code
                </button>
            </form>

            <div class="mt-10 pt-8 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">
                    Vous n'avez rien reçu ? 
                    <a href="/recup_password" class="text-red-600 font-bold hover:underline ml-1">Renvoyer</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Logique du Timer
    let duration = 300; // 5 minutes en secondes
    const display = document.querySelector('#timer');
    
    const startTimer = (duration, display) => {
        let timer = duration, minutes, seconds;
        const countdown = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(countdown);
                display.textContent = "EXPIRÉ";
                display.classList.add('text-slate-400', 'bg-slate-100');
            }
        }, 1000);
    };

    // 2. Logique des inputs (Auto-focus et concaténation)
    const inputs = document.querySelectorAll('#otp-inputs input');
    const fullOtpInput = document.querySelector('#full-otp');

    inputs.forEach((input, index) => {
        // Passer au suivant après saisie
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            updateFullOtp();
        });

        // Retour en arrière (Backspace)
        input.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !e.target.value && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });

    function updateFullOtp() {
        let otpValue = "";
        inputs.forEach(input => otpValue += input.value);
        fullOtpInput.value = otpValue;
    }

    window.onload = () => startTimer(duration, display);
</script>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
</style>
{% endblock %}
