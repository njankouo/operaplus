<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à Jour Profil | MEAL Afrique</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Animations pour l'entrée des éléments */
        .fade-in {
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Bouton avec effet hover */
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Conteneur général de la page */
        body {
            font-family: 'Roboto', sans-serif;
        }

        .form-container {
            background-color: #111111;
            color: white;
        }

        .btn-orange {
            background-color: #ff6600;
        }

        .btn-orange:hover {
            background-color: #e65c00;
        }

        .text-orange {
            color: #ff6600;
        }

        .input-field {
            background-color: #2c2c2c;
            border: 1px solid #333;
        }

        .input-field:focus {
            border-color: #ff6600;
        }

        .dark-mode {
            background-color: #1a1a1a;
            color: white;
        }

        .light-mode {
            background-color: #f7f7f7;
            color: black;
        }
    </style>
</head>
<body id="body" class="bg-gray-900 text-white">

    <!-- Titre de la page -->
    <div class="text-center p-8 fade-in">
        <h2 class="text-3xl font-bold text-orange-500">Mise à jour de votre profil</h2>
        <p class="text-sm text-slate-500">Modifiez vos informations ci-dessous et soumettez le formulaire pour mettre à jour votre profil sur la plateforme MEAL Afrique.</p>
    </div>

    <!-- Switch pour changer le thème -->
   <div class="absolute top-4 right-4">
    <button id="themeSwitch" class="bg-orange-500 text-white p-3 rounded-full shadow-lg hover:bg-orange-600">
        <i id="themeIcon" class="fas fa-moon"></i>
    </button>
</div>

    <!-- Formulaire de mise à jour -->
    <div class="max-w-4xl mx-auto p-8 form-container rounded-2xl shadow-lg">
        <form id="updateForm" class="grid grid-cols-1 md:grid-cols-2 gap-6" action="{%url 'Update-profil'%}" method="post" enctype="multipart/form-data">

            {% csrf_token %}
            
            <!-- Photo de Profil -->
            <div class="md:col-span-2 flex flex-col md:flex-row items-center gap-8 pb-8 border-b border-slate-200 dark:border-white/5 mb-4">
                <div class="relative group">
                    <!-- Image preview -->
                    <img id="previewPhoto" src="
                    {%if personnel.photo%}
                    {{personnel.photo.url}}
                    {%else%}
                    https://ui-avatars.com/api/?background=f97316&color=fff&name=MEAL
                    {%endif%}
                    " class="w-24 h-24 md:w-32 md:h-32 rounded-full object-cover border-4 border-white dark:border-slate-800 shadow-xl transition-transform group-hover:scale-105">
                    <label for="photoUpload" class="absolute -bottom-1 -right-1 w-10 h-10 bg-orange-500 text-white rounded-full flex items-center justify-center cursor-pointer shadow-lg hover:bg-orange-600 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3" stroke-linecap="round"/></svg>
                    </label>
                    <input type="file" id="photoUpload" name="photo" class="hidden" onchange="previewImage(event)">
                </div>
                <div class="text-center md:text-left">
                    <h3 class="font-black text-2xl md:text-3xl text-white leading-tight">
                        Inscription à la communauté
                    </h3>
                    <p class="text-xs text-orange-500 font-bold uppercase tracking-[0.3em] mt-6">Uploadez Votre Photo</p>
                </div>
            </div>

            <!-- Informations Personnelles -->
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Identité</label>
                    <input type="text" name="fullname" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none" placeholder="Nom complet" value="{{personnel.nom}}">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Pays</label>
                    <select name="country" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none">
                     
                      {% for code, name in countries %}
                    <option value="{{ code }}"
                        {% if personnel.country == code or personnel.pays == code %}selected{% endif %}>
                        {{ name }}
                    </option>
                {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Numéro WhatsApp</label>
                    <input type="tel" id="whatsapp" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none" name="whatsapp" value="{{personnel.tel}}">
                </div>
            </div>

            <!-- Contact Pro et autres informations -->
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Contact Pro</label>
                    <input type="email" name="email" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none" placeholder="email@domaine.com" value="{{personnel.mail}}">
                </div>
                <div class="md:col-span-2">
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Expertise</label>
                    <input type="text" name="skill" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none" placeholder="ex: Informatique; DataAnalyst...." value="{{personnel.fonction}}">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Nationalité</label>
                    <input type="text" name="nationalite" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none" placeholder="ex: Cameroun...." value="{{personnel.nationalite}}">
                </div>
            </div>

            <!-- Expertise -->
            <div class="md:col-span-2">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1 mb-2 block tracking-widest">Parcours Meal</label>
                <textarea type="text" name="parcours_meal" required class="w-full px-5 py-4 rounded-2xl input-field focus:outline-none" placeholder="ex: Meal Officer - Premières Urgences; Ancien Superviseur Meal..." >{{personnel.parcours_meal}}</textarea>
            </div>
            <input type="hidden" name="personnel" value="{{personnel.id}}">
            <!-- Button to submit -->
            <button type="submit" class="md:col-span-2 w-full bg-orange-500 hover:bg-orange-600 text-white py-5 rounded-2xl font-black uppercase tracking-[0.3em] text-[11px] shadow-2xl shadow-orange-500/30 active:scale-[0.98] transition-all btn-hover">
                Editer mon Profil
            </button>
        </form>
    </div>

    <script>
        // Fonction de prévisualisation de l'image téléchargée
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                document.getElementById('previewPhoto').src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // Fonction pour basculer entre le mode clair et sombre
        document.getElementById('themeSwitch').addEventListener('click', function() {
            var body = document.getElementById('body');
            var button = document.getElementById('themeSwitch');
            
            // Bascule entre les classes dark-mode et light-mode
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                button.textContent = 'Passer au mode sombre';
            } else {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                button.textContent = 'Passer au mode clair';
            }
        });
    </script>

</body>
</html>
