<div class="p-6 space-y-6 animate-in fade-in duration-500">
    
    <div class="flex flex-col items-center text-center space-y-4">
        <div class="relative w-24 h-24 bg-white rounded-2xl border border-slate-200 flex items-center justify-center shadow-sm">
            <i class="fas fa-file-pdf text-4xl text-indigo-500"></i>
        </div>
        <h4 class="font-bold text-slate-900 text-sm truncate max-w-[200px]">{{ archive.titre }}</h4>
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
            <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Auteur</p>
            <p class="text-xs font-semibold text-slate-700 mt-1">{{ archive.auteur|default:"Admin" }}</p>
        </div>
        
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
            <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Poids</p>
            <p class="text-xs font-semibold text-slate-700 mt-1">{{ archive.taille|default:"0" }} {{ archive.unite|default:"MB" }}</p>
        </div>
        
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
            <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Créé le</p>
            <p class="text-xs font-semibold text-slate-700 mt-1">{{ archive.date_creation|date:"d/m/Y" }}</p>
        </div>
        
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
            <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Modifié le</p>
            <p class="text-xs font-semibold text-slate-700 mt-1">{{ archive.date_modification|date:"d/m/Y" }}</p>
        </div>
    </div>

    <div class="space-y-3 pt-4 border-t border-slate-100">
        <a href="{{ archive.file.url }}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-slate-900 text-white py-3 rounded-xl hover:bg-slate-800 transition text-xs font-bold shadow-lg">
            <i class="fas fa-download"></i> Télécharger
        </a>
        
        <div class="flex gap-2">
            <button class="flex-1 flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-600 py-2.5 rounded-xl hover:bg-slate-50 transition text-xs font-bold">
                <i class="fas fa-edit"></i> Modifier
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 bg-red-50 border border-red-100 text-red-600 py-2.5 rounded-xl hover:bg-red-100 transition text-xs font-bold">
                <i class="fas fa-trash-alt"></i> Supprimer
            </button>
        </div>
    </div>
</div>
