{% extends './index.html' %}

{% block main %}
<div class="max-w-5xl mx-auto p-4 sm:p-6">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <div class="px-6 py-4 text-white" style="background-color: {{ request.user.personnel.color_fond }};">
            <h5 class="text-lg font-bold flex items-center">
                <i class="fas fa-comment-dots mr-2"></i> Nouveau Commentaire
            </h5>
        </div>

        <div class="p-6">
            <form method="POST" action="/transaction-rapport/" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label for="commentaire" class="block text-sm font-bold text-slate-700 mb-2">Votre Commentaire <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <textarea id="commentaire" name="commentaire" rows="4" required
                            class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            placeholder="Saisissez votre commentaire ici..."></textarea>
                    </div>
                </div>

                <input type="hidden" name="history" value="{{historic.id}}">

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Pièces jointes <span class="text-slate-400 font-normal">(Optionnel)</span></label>
                    <label for="attachment" class="flex flex-col items-center justify-center w-full py-6 border-2 border-dashed border-blue-400 rounded-xl cursor-pointer hover:bg-blue-50 transition-colors">
                        <i class="fas fa-cloud-upload-alt text-4xl text-blue-500 mb-2"></i>
                        <h6 class="font-semibold text-slate-700">Glissez-déposez vos fichiers</h6>
                        <p class="text-xs text-slate-500">ou cliquez pour sélectionner</p>
                    </label>
                    <input type="file" id="attachment" name="file" class="hidden">
                    <div id="files-names" class="mt-3 flex flex-wrap gap-2"></div>
                </div>

                <input type="hidden" value="{{ historic.operation_id }}" name="operation_id">
                <input type="hidden" value="{{ line.personnel.nom }}" name="role">

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Progression</label>
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-tasks text-blue-600 text-lg"></i>
                        <select id="progression_select" name="niveau_execution" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                            <option value="" selected disabled>-- Sélectionnez un niveau --</option>
                            <option value="0">0% - Non commencé</option>
                            <option value="25">25% - En cours</option>
                            <option value="50">50% - À mi-chemin</option>
                            <option value="75">75% - Presque terminé</option>
                            <option value="100">100% - Complété</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="preciser_checkbox" class="w-5 h-5 text-green-600 rounded focus:ring-green-500 border-slate-300">
                    <label for="preciser_checkbox" class="ml-3 text-sm font-bold text-slate-700">Préciser la progression (en %)</label>
                </div>

                <div id="preciser_input_group" class="hidden">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Précisez le pourcentage</label>
                    <div class="flex items-center">
                        <input type="number" name="precision" id="precision_value" min="0" max="100" class="w-full p-3 border border-slate-300 rounded-l-xl focus:ring-2 focus:ring-blue-500">
                        <span class="px-4 py-3 text-white rounded-r-xl" style="background-color: {{request.user.personnel.color_fond}};">%</span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Date réalisation</label>
                    <div class="flex items-center">
                        <i class="fas fa-calendar mr-3 text-blue-600 text-lg"></i>
                        <input type="date" name="date_realisation" class="w-full p-3 border border-slate-300 rounded-xl">
                    </div>
                </div>

                <div class="flex justify-between pt-4">
                    <a href="/alert_notifs/0/0/" class="px-6 py-3 border border-slate-300 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition">
                        Annuler
                    </a>
                    <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-transform hover:-translate-y-1">
                        <i class="fas fa-paper-plane mr-2"></i> Envoyer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Votre logique JS reste inchangée. 
    // Assurez-vous que les IDs (progression_select, preciser_checkbox, etc.) correspondent toujours.
    document.getElementById('attachment').addEventListener('change', function(e) {
        const filesList = document.getElementById('files-names');
        filesList.innerHTML = '';
        for (let i = 0; i < this.files.length; i++) {
            const fileItem = document.createElement('div');
            fileItem.className = 'bg-slate-100 text-slate-600 text-xs px-3 py-2 rounded-lg flex items-center animate-fadeIn';
            fileItem.innerHTML = `<i class="fas fa-file-alt mr-2"></i> ${this.files[i].name}`;
            filesList.appendChild(fileItem);
        }
    });

    const progressionSelect = document.getElementById('progression_select');
    const preciserCheckbox = document.getElementById('preciser_checkbox');
    const preciserInputGroup = document.getElementById('preciser_input_group');

    progressionSelect.addEventListener('change', () => {
        if (progressionSelect.value !== '') {
            preciserCheckbox.checked = false;
            preciserInputGroup.classList.add('hidden');
        }
    });

    preciserCheckbox.addEventListener('change', () => {
        if (preciserCheckbox.checked) {
            preciserInputGroup.classList.remove('hidden');
            progressionSelect.value = '';
        } else {
            preciserInputGroup.classList.add('hidden');
        }
    });
</script>
{% endblock %}
