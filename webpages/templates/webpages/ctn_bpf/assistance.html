{% extends './no_institution.html' %}

{% block content %}
<div class="max-w-4xl mx-auto h-[650px] flex flex-col bg-white border border-slate-200 rounded-3xl shadow-2xl overflow-hidden mt-10">
    
    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-white">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-50 rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-robot text-emerald-600"></i>
            </div>
            <div>
                <h2 class="text-sm font-bold text-slate-900">Assistant Intelligence</h2>
                <div class="flex items-center gap-1.5">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-[10px] text-slate-400 font-medium uppercase">Système actif</span>
                </div>
            </div>
        </div>
        <button class="text-slate-400 hover:text-slate-600 transition-colors">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
    </div>

    <!-- Zone de messages -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-8 bg-slate-50/50">
        <!-- Message IA -->
        <div class="flex gap-4 group">
            <div class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center shadow-sm shrink-0">
                <i class="fa-solid fa-sparkles text-[10px] text-emerald-500"></i>
            </div>
            <div class="bg-white p-4 rounded-2xl rounded-tl-sm border border-slate-100 shadow-sm max-w-[75%]">
                <p class="text-[14px] text-slate-700 leading-relaxed">Bonjour ! Je suis votre assistant. Comment puis-je vous accompagner dans vos analyses aujourd'hui ?</p>
            </div>
        </div>

        <!-- Message Utilisateur -->
        <div class="flex gap-4 flex-row-reverse">
            <div class="bg-emerald-600 p-4 rounded-2xl rounded-tr-sm shadow-lg max-w-[75%]">
                <p class="text-[14px] text-white leading-relaxed">Peux-tu me faire un résumé de l'état financier du projet en cours ?</p>
            </div>
        </div>
    </div>

    <!-- Zone de saisie -->
    <form id="chat-form" class="p-4 bg-white border-t border-slate-100">
        {% csrf_token %}
        <div class="relative flex items-center bg-slate-100 rounded-2xl p-1">
            <input type="text" id="user-input" 
                   class="w-full bg-transparent py-3 pl-4 pr-12 text-[14px] outline-none text-slate-700 placeholder:text-slate-400"
                   placeholder="Posez votre question..." required>
            <button type="submit" class="absolute right-2 w-9 h-9 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all shadow-md active:scale-95">
                <i class="fa-solid fa-arrow-up text-[12px]"></i>
            </button>
        </div>
    </form>
</div>

<script>
    // Logique basique pour intercepter l'envoi
    const form = document.getElementById('chat-form');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('user-input');
        console.log("Message envoyé:", input.value);
        // Ici, vous ajouterez votre appel fetch() vers votre vue Django
        input.value = '';
    });
</script>
{% endblock %}
