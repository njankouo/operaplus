{%extends './index.html'%}

{%block content%}

<div class="card">

  <div class="card-body">

    <div class="card-header" style='background:{{request.user.personnel.color}}'>

      <h6 class="text-light text-center font-bold" style='background:{{request.user.personnel.color}}, color:white'>Modification {{entity.m_type_entity}} {{entity}}</h6>

    </div>


    <form class="form-horizontal bordered-row" action="/save_entity_value/" method="post">
        {% csrf_token %}
        <label for="nom">Nom</label>
      <input type="text" name="nom" value="{{entity}}" class="form-control">

      <label for="ponderation">Ponderation</label>

      <input type="text" name="ponderation" value="{{entity.ponderation}}" class="form-control">

      {%if entity.m_pic_represented%}
      <label for="">image</label>
      <input type="file" name="image" value="">
      {%endif%}
        <button type="submit" class="btn btn-primary">Mettre à jour</button>
    </form>
  </div>

</div>
