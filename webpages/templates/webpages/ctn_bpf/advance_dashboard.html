{%extends './index.html'%}
{%block main%}
  
<div class="w-full p-4">
    <!-- En-tête ou titre optionnel -->
    <div class="mb-6">
        <h1 class="text-xl font-black text-slate-800 uppercase tracking-wider">Tableau de bord Avancé</h1>
    </div>

    <!-- Scripts Metabase -->
    <script defer src="https://metabase.operaplus.org/app/embed.js"></script>
    <script>
    function defineMetabaseConfig(config) {
      window.metabaseConfig = config;
    }
    defineMetabaseConfig({
        "theme": {
            "preset": "light"
        },
        "isGuest": true,
        "instanceUrl": "https://metabase.operaplus.org"
    });
    </script>

    <!-- Composant Metabase avec le Token généré par Django -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 overflow-hidden">
        <metabase-dashboard 
            token="{{ metabase_token }}" 
            with-title="true" 
            with-downloads="true"
            style="width: 100%; height: 750px; display: block;">
        </metabase-dashboard>
    </div>
</div>
{%endblock%}
