server {
    listen 443 ssl;
    server_name mboamarket.com;

    # SSL Certificates (Ensure these paths are correct)
    ssl_certificate /etc/letsencrypt/live/mboamarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mboamarket.com/privkey.pem;

    # Security & Upload Size
    client_max_body_size 100M;

    # Static Files
    location /static/ {
        alias /home/e-boutique/Boutique/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media Files
    location /media/ {
        alias /home/e-boutique/Boutique/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Backend Application
    location / {
        proxy_pass http://84.247.183.37:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Help with timeouts during large uploads
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name mboamarket.com;

    return 301 https://$host$request_uri;
}