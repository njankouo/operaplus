{% extends './dataelts.html' %}
{% block content %}

<div class="max-w-4xl mx-auto mt-6">
    
    <div class="bg-slate-800 rounded-xl shadow-lg border border-slate-700">

        <!-- HEADER -->
        <div class="px-6 py-4 border-b border-slate-700">
            <h2 class="text-lg font-semibold text-white">Modifier une période</h2>
        </div>

        <!-- FORM -->
        <form method="POST" action="/edition_periode/{{periode.id}}/" class="p-6 space-y-6">
            {% csrf_token %}

            <!-- ROW 1 -->
            <div class="grid md:grid-cols-2 gap-4">
                
                <div>
                    <label class="label">Nom</label>
                    <input type="text" name="nom" value="{{periode.nom}}" class="input">
                </div>

                <div>
                    <label class="label">Année</label>
                    <input type="text" name="annee" value="{{periode.annee}}" class="input">
                </div>

            </div>

            <!-- ROW 2 -->
            <div class="grid md:grid-cols-3 gap-4">

                <div>
                    <label class="label">Périodicité</label>
                    <select name="periodicite" class="input">
                        <option></option>
                        {% for periodicites in periodicite %}
                            <option value="{{ periodicites.id }}"
                                {% if periodicites.id == periode.periodicite_id %}selected{% endif %}>
                                {{ periodicites.m_value }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="label">Numéro d'ordre</label>
                    <input type="number" name="numero" value="{{periode.numero_ordre}}" class="input">
                </div>

                <div>
                    <label class="label">Nice name</label>
                    <input type="text" name="nicename" value="{{periode.nicename}}" class="input">
                </div>

            </div>
            <div class="grid md:grid-cols-2 gap-4">

    <div>
        <label class="label">Période Début</label>
        <input type="date" name="date_debut"
               value="{{ periode.date_debut|date:'Y-m-d' }}"
               class="input">
    </div>

    <div>
        <label class="label">Période Fin</label>
        <input type="date" name="date_fin"
               value="{{ periode.date_fin|date:'Y-m-d' }}"
               class="input">
    </div>

</div>

            <!-- ACTION -->
            <div class="flex justify-end pt-4 border-t border-slate-700">
                <button type="submit" class="btn-primary">
                    Enregistrer
                </button>
            </div>

        </form>
    </div>

</div>

<style>
    .label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    color: #94a3b8;
}

.input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    font-size: 0.9rem;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.input:focus {
    border-color: #3b82f6;
    outline: none;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
}

.btn-primary {
    background: #2563eb;
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s;
}

.btn-primary:hover {
    background: #1d4ed8;
}
</style>
{% endblock %}
