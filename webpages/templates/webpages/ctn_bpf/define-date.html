<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisie Période - Modern S&E</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .dhis2-blue-gradient {
            background: linear-gradient(135deg, #2c6693 0%, #1e4b6e 100%);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl shadow-blue-900/5 border border-slate-200">
        
        <!-- Header avec dégradé subtil -->
        <div class="dhis2-blue-gradient p-6 rounded-t-2xl">
            <div class="flex items-center gap-4">
                <div class="p-2 bg-white/10 rounded-lg backdrop-blur-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h2 class="text-white font-semibold text-lg leading-tight">Période d'évaluation</h2>
                    <p class="text-blue-100 text-xs">Définissez la plage temporelle du projet</p>
                </div>
            </div>
        </div>

        <!-- Formulaire -->
        <div class="p-8">
            <form method="POST" action="/valide-date/">
                {%csrf_token%}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative">
                
                <!-- Date de début -->
                <div class="relative group">
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 block transition-colors group-focus-within:text-blue-600">
                        Date de début
                    </label>
                    <div class="relative">
                       <input type="date" id="start_date" name="start_date"  
       value="{{ actual_institution.date_debut|date:'Y-m-d' }}"  
       class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-700 font-medium focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all outline-none">
                    </div>
                </div>

                <!-- Date de fin -->
                <div class="relative group">
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 block transition-colors group-focus-within:text-blue-600">
                        Date de fin
                    </label>
                    <div class="relative">
                        <input type="date" id="end_date" name="end_date"  
       value="{{ actual_institution.date_fin|date:'Y-m-d' }}"  
       class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-slate-700 font-medium focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all outline-none">
                    </div>
                </div>

                <!-- Connecteur visuel (uniquement sur desktop) -->
                <div class="hidden md:block absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 mt-3">
                    <div class="bg-white border-2 border-slate-100 p-1.5 rounded-full text-slate-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Footer / Actions -->
            <div class="mt-10 pt-6 border-t border-slate-100 flex items-center justify-between">
                <span class="text-xs text-slate-400 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                    Système prêt
                </span>
                
                <div class="flex gap-3">
                    <a href="/" class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                        Annuler
                    </a>
                    <button type="submit" class="px-8 py-2.5 text-sm font-semibold text-white dhis2-blue-gradient rounded-xl shadow-lg shadow-blue-900/20 hover:scale-[1.02] active:scale-[0.98] transition-all">
                        Confirmer la période
                    </button>
                </div>
            </div>
        </form>
        </div>
    </div>

    <script>
        const start = document.getElementById('start_date');
        const end = document.getElementById('end_date');

        start.addEventListener('change', () => {
            if (start.value) {
                end.min = start.value;
                end.classList.add('border-blue-200');
            }
        });
    </script>
</body>
</html>
