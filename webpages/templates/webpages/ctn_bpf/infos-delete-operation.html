{% extends "./index.html" %}
{% block main %}

<div class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 flex flex-col items-center text-center">
        
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </div>

        <h2 class="text-2xl font-black text-slate-900 mb-2">Supprimer cette opération ?</h2>

        <p class="text-slate-500 mb-8">
            <span class="font-bold text-slate-800">{{ operation.nom }}</span><br>
            Cette action est irréversible.
        </p>

        <div class="w-full bg-slate-100 rounded-xl p-4 mb-8 border border-slate-200">
            <div class="flex items-center gap-2 text-indigo-600 mb-2 font-bold text-sm">
                <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Redistribution automatique</span>
            </div>
            <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-indigo-500 w-3/4 rounded-full animate-pulse"></div>
            </div>
            <small class="text-[10px] text-slate-400 mt-2 block uppercase tracking-widest font-bold">Total de 100% maintenu sur les tâches restantes</small>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full mb-8">
            <a href="/taches/{{ operation.tache_id }}/" 
               class="px-4 py-3 rounded-xl border border-slate-200 font-bold text-slate-600 hover:bg-slate-50 transition-all">
                Annuler
            </a>
            <a href="/delete/operation/{{ operation.id }}/{{ operation.tache_id }}/" 
               class="px-4 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-lg shadow-red-200 transition-all active:scale-95">
                Supprimer
            </a>
        </div>

        <div class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">
            ID SYSTÈME : #{{ operation.id }}
        </div>
    </div>
</div>

{% endblock %}
