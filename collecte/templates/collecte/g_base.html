{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titre %}Collecte terrain{% endblock %} — OperaPlus</title>
<link rel="icon" href="{% static 'collecte/icones/icone-192.png' %}">
<style>
:root{--acc:{{ request.user.personnel.color_fond|default:"#0f766e" }};--acc-s:color-mix(in srgb,var(--acc) 9%,#fff);--acc-l:color-mix(in srgb,var(--acc) 28%,#fff);--ink:#0f172a;--txt:#334155;--mute:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt)}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
.g-top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.5rem;background:#fff;border-bottom:1px solid var(--line)}
.g-top b{font-size:1rem;color:var(--ink);display:flex;align-items:center;gap:.6rem}
.g-top b i{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:800}
.g-top nav{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:auto}
.g-top nav a{padding:.45rem .8rem;border-radius:9px;color:var(--txt);text-decoration:none;font-weight:600}
.g-top nav a:hover,.g-top nav a.on{background:var(--acc-s);color:var(--ink)}
.g-page{max-width:1200px;margin:0 auto;padding:1.5rem}
h1{margin:0;font-size:1.35rem;color:var(--ink)}
.g-sub{margin:.25rem 0 1.25rem;color:var(--mute)}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.g-head .g-sub{margin-bottom:0}
.g-btn{display:inline-flex;align-items:center;gap:.45rem;height:38px;padding:0 1rem;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.g-btn-p{background:var(--acc);color:#fff}.g-btn-p:hover{filter:brightness(.92)}
.g-btn-s{background:#fff;border-color:var(--line);color:var(--txt)}.g-btn-s:hover{background:#f8fafc}
.g-btn-d{background:#fff;border-color:#fecaca;color:#b91c1c}
.g-carte{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem}
.g-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-bottom:1.25rem}
.g-kpis div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem}
.g-kpis b{display:block;font-size:1.4rem;color:var(--ink)}
.g-kpis span{font-size:.75rem;color:var(--mute);font-weight:600}
.g-tag{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;padding:.2rem .55rem;border-radius:99px;background:#f1f5f9;color:#475569}
.g-tag.ok{background:#ecfdf5;color:#047857}.g-tag.ko{background:#fef2f2;color:#b91c1c}.g-tag.wa{background:#fffbeb;color:#b45309}.g-tag.acc{background:var(--acc-s);color:var(--ink)}
table.g-t{width:100%;border-collapse:collapse;background:#fff;font-size:.82rem}
.g-tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.g-t th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:.6rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
.g-t td{padding:.55rem .7rem;border-bottom:1px solid #f1f5f9;vertical-align:top}
.g-t td small{color:var(--mute)}
.g-t img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block}
.g-filtres{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1rem}
.g-filtres a{padding:.35rem .8rem;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:600;font-size:.8rem}
.g-filtres a.on{background:var(--ink);border-color:var(--ink);color:#fff}
.g-msg{padding:.7rem 1rem;border-radius:12px;margin-bottom:1rem;font-weight:600}
.g-msg.ok{background:#ecfdf5;color:#065f46}.g-msg.ko{background:#fef2f2;color:#991b1b}
.g-vide{padding:2rem;text-align:center;color:var(--mute);background:#fff;border:1px dashed #cbd5e1;border-radius:14px}
input.g-in,select.g-in,textarea.g-in{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:.5rem .7rem;background:#fff}
.g-in:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
label.g-l{display:flex;flex-direction:column;gap:.3rem;font-size:.78rem;font-weight:700;color:var(--txt)}
@media (max-width:800px){.g-kpis{grid-template-columns:1fr 1fr}.g-page{padding:1rem}}
</style>
{% block style %}{% endblock %}
</head>
<body>
<header class="g-top">
  <b><i>OP</i> Collecte terrain</b>
  <nav>
    <a href="{% url 'collecte_g_accueil' %}" class="{% block n1 %}{% endblock %}">Questionnaires</a>
    <a href="{% url 'collecte_g_declarations' %}" class="{% block n2 %}{% endblock %}">Déclarations reçues</a>
    <a href="{% url 'collecte_pwa' %}">Ouvrir l’appli terrain</a>
    <a href="/">OperaPlus</a>
  </nav>
</header>
<div class="g-page">{% block contenu %}{% endblock %}</div>
</body>
</html>
