{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6FC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OP Terrain">
<title>OperaPlus Terrain</title>
<link rel="manifest" href="{% url 'collecte_manifeste' %}">
<link rel="icon" href="{% static 'collecte/icones/icone-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'collecte/icones/icone-192.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>
/* thème appliqué AVANT l'affichage : pas de flash de couleur */
(function(){try{var t=JSON.parse(localStorage.getItem('op-terrain-theme')||'{}');var m=t.mode||'auto';
if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'sombre':'clair';
document.documentElement.dataset.mode=m;document.documentElement.dataset.couleur=t.couleur||'violet';}catch(e){document.documentElement.dataset.mode='clair';}})();
</script>
<link rel="stylesheet" href="{% static 'collecte/terrain.css' %}?v={{ version }}">
<style>#tSplash{position:fixed;inset:0;background:#0E0D19;z-index:100}</style>
</head>
<body>
<div id="tSplash" role="status" aria-label="Chargement">
  <span class="c-logo"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#5B3FE0"/><circle cx="240" cy="246" r="128" fill="none" stroke="#7E68F0" stroke-width="56"/><path d="M240 118A128 128 0 1 1 119.7 202.2" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round"/><circle cx="372" cy="374" r="92" fill="#5B3FE0"/><circle cx="372" cy="374" r="76" fill="#F59E0B"/><path d="M372 336V412M334 374H410" stroke="#fff" stroke-width="24" stroke-linecap="round"/></svg></span>
  <b>OperaPlus Terrain</b>
  <small>Déclarer. Collecter. Synchroniser.</small>
  <span class="bar"><s></s></span>
</div>

<header class="t-top">
  <div class="t-hello"><b id="tSalut">Bonjour 👋</b><span class="t-statut"><i class="t-dot" id="tDot"></i><span id="tEtat">En ligne</span></span></div>
  <button class="t-rond" id="tSync" aria-label="Synchroniser maintenant"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg><span class="t-badge" id="tNb"></span></button>
</header>
<div id="tBanniere" class="t-ban" hidden></div>
<main id="tVue" aria-live="polite"></main>
<div id="tPied"></div>
<nav class="t-nav" id="tNav">
  <button data-route="accueil"><span class="pil"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Accueil</button>
  <button data-route="taches"><span class="pil"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>Tâches</button>
  <button class="t-plus" id="tPlus" aria-label="Nouvelle saisie"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-route="envois"><span class="pil"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg></span>Envois<span class="t-badge" id="tNb2"></span></button>
  <button data-route="profil"><span class="pil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Profil</button>
</nav>
<div id="tCouche"></div>
<div id="tToast" aria-live="assertive"></div>
<form id="tLogout" method="post" action="{% url 'collecte_deconnexion' %}" hidden>{% csrf_token %}</form>

<script>
window.OP_CONF = {
  racine: '{% url "collecte_pwa" %}', csrf: '{{ csrf }}', nom: '{{ nom|escapejs }}', prenom: '{{ prenom|escapejs }}',
  email: '{{ email|escapejs }}', institution: '{{ institution|escapejs }}', version: '{{ version }}',
  login: '{% url "collecte_connexion" %}',
  bureau: {% if gestionnaire %}'{% url "collecte_g_accueil" %}'{% else %}''{% endif %}, sw: '{% url "collecte_sw" %}'
};
</script>
<script src="{% static 'collecte/sync.js' %}?v={{ version }}"></script>
<script src="{% static 'collecte/terrain.js' %}?v={{ version }}"></script>
</body>
</html>
