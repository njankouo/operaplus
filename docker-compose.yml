version: "3.9"

services:
  web:
    image: ghcr.io/njankouo/operaplus:${IMAGE_TAG:-latest} 
    build: .
    container_name: meal-app-web
    env_file: .env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - global_proxy

  # --- LE BROKER (REDIS) ---
  redis:
    image: redis:7-alpine
    container_name: meal-app-redis
    restart: unless-stopped
    networks:
      - global_proxy

  # --- CELERY WORKER (Exécution des tâches) ---
  celery_worker:
    build: .
    image: ghcr.io/njankouo/operaplus:${IMAGE_TAG:-latest}
    container_name: meal-app-worker
    command: celery -A Opera_CTN worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - global_proxy

  # --- CELERY BEAT (Tâches planifiées) ---
  celery_beat:
    build: .
    image: ghcr.io/njankouo/operaplus:${IMAGE_TAG:-latest}
    container_name: meal-app-beat
    command: celery -A Opera_CTN beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - global_proxy

  db:
    image: postgres:15
    container_name: meal-app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: corporate2019
      POSTGRES_DB: puruk
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - global_proxy

networks:
  global_proxy:
    external: true

volumes:
  static_volume: {}
  media_volume: {}
  db_data: {}
